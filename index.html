<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Pacifico', cursive;
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      color: #b30059;
      margin-bottom: 40px;
    }

    .buttons {
      position: relative;
      height: 200px;
    }

    /* YES BUTTON WITH HOTSPOT */
    #yes {
      position: relative;
      font-size: 1.8rem;
      padding: 15px 40px;
      border: none;
      border-radius: 40px;
      background-color: #ff4d88;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* Pulse / hotspot animation */
    #yes::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: hotspot 1.8s infinite;
    }

    @keyframes hotspot {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -50%) scale(6);
        opacity: 0;
      }
    }

    #no {
      position: absolute;
      font-size: 0.6rem;
      padding: 5px 10px;
      border-radius: 20px;
      background-color: #f2f2f2;
      color: #777;
      border: none;
      cursor: pointer;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      from { transform: translateY(0); }
      to { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- SINGLE AUDIO ELEMENT -->
  <audio id="bg-music" preload="auto">
    <source src="giveon-stuck-on-you.mp3" type="audio/mpeg">
  </audio>

  <div class="container" id="main-content">
    <h1>Sandra, will you be my Valentine? 💖</h1>

    <div class="buttons">
      <button id="yes">YES 💕</button>
      <button id="no">no</button>
    </div>
  </div>

  <script>
    const music = document.getElementById("bg-music");
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const container = document.getElementById("main-content");

    music.volume = 1;

    function safePlay() {
      music.play().catch(() => {});
    }

    // Start first song on first interaction
    document.addEventListener("click", safePlay, { once: true });

    // Fade utility
    function fade(to, duration, callback) {
      const steps = 25;
      const stepTime = duration / steps;
      const start = music.volume;
      const change = to - start;
      let current = 0;

      const interval = setInterval(() => {
        current++;
        music.volume = Math.min(Math.max(start + (change * current / steps), 0), 1);
        if (current >= steps) {
          clearInterval(interval);
          if (callback) callback();
        }
      }, stepTime);
    }

    // YES CLICK LOGIC
    yesBtn.addEventListener("click", () => {
      safePlay();

      // 📱 Vibration
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }

      // Fade out Giveon
      fade(0, 1200, () => {
        music.pause();
        music.src = "fridayy-stand-by-me.mp3";
        music.load();

        music.oncanplaythrough = () => {
          music.volume = 0;
          music.play();
          fade(1, 1200);
        };
      });

      // Update UI (audio stays alive)
      container.innerHTML = `
        <h1>
          Yaaay! 💖💍<br>
          You are stuck with me now 😌💖
        </h1>
      `;
    });

    // Runaway NO
    noBtn.addEventListener("mouseenter", () => {
      noBtn.style.left = Math.random() * 300 + "px";
      noBtn.style.top = Math.random() * 150 + "px";
    });

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
