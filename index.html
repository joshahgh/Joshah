<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Pacifico', cursive;
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      color: #b30059;
      margin-bottom: 40px;
    }

    .buttons {
      position: relative;
      height: 200px;
    }

    #yes {
      font-size: 1.8rem;
      padding: 15px 40px;
      border: none;
      border-radius: 40px;
      background-color: #ff4d88;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    #no {
      position: absolute;
      font-size: 0.6rem;
      padding: 5px 10px;
      border-radius: 20px;
      background-color: #f2f2f2;
      color: #777;
      border: none;
      cursor: pointer;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- AUDIO -->
  <audio id="bg-music" preload="auto" loop>
    <source src="giveon-stuck-on-you.mp3" type="audio/mpeg">
  </audio>

  <div class="container" id="main-content">
    <h1>Sandra, will you be my Valentine? 💖</h1>

    <div class="buttons">
      <button id="yes">YES 💕</button>
      <button id="no">no</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const music = document.getElementById("bg-music");
    const container = document.getElementById("main-content");

    function playMusic() {
      music.play().catch(() => {});
    }

    // Start music on first interaction
    document.addEventListener("click", playMusic, { once: true });

    // Fade helper
    function fadeVolume(from, to, duration, callback) {
      const steps = 20;
      const stepTime = duration / steps;
      let currentStep = 0;
      const volumeStep = (to - from) / steps;

      music.volume = from;

      const interval = setInterval(() => {
        currentStep++;
        music.volume = Math.min(Math.max(music.volume + volumeStep, 0), 1);

        if (currentStep >= steps) {
          clearInterval(interval);
          if (callback) callback();
        }
      }, stepTime);
    }

    // YES CLICK
    yesBtn.addEventListener("click", () => {
      playMusic();

      // 📱 Mobile vibration
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }

      // Fade out Giveon
      fadeVolume(1, 0, 1200, () => {
        music.pause();
        music.src = "fridayy-stand-by-me.mp3";
        music.load();
        music.play();

        // Fade in Fridayy
        fadeVolume(0, 1, 1200);
      });

      // Update UI without killing audio
      container.innerHTML = `
        <h1>
          Yaaay! 💖💍<br>
          You are stuck with me now 😌💖
        </h1>
      `;
    });

    // Runaway NO
    noBtn.addEventListener("mouseenter", () => {
      noBtn.style.left = Math.random() * 300 + "px";
      noBtn.style.top = Math.random() * 150 + "px";
    });

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
